<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChrisCBTs — JAMB CBT Practice</title>
<style>
:root{--primary:#2563eb;--secondary:#7c3aed;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb;--success:#16a34a;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,select{font:inherit}.app{min-height:100vh}.top{background:linear-gradient(135deg,#111827,#2563eb 60%,#7c3aed);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:10}.brand{font-size:25px;font-weight:900}.brand span{color:#bfdbfe}.top small{opacity:.85}.container{max-width:1150px;margin:auto;padding:30px 18px}
.hero{padding:28px 0 20px}.hero h1{font-size:clamp(30px,5vw,52px);margin:0 0 10px}.hero p{color:var(--muted);max-width:700px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.choice{cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-3px);border-color:#93c5fd}.choice h3{margin:10px 0 5px}.choice p{color:var(--muted);margin:0}.icon{font-size:35px}.section-title{margin:28px 0 14px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.control{background:#fff;border:1px solid var(--border);padding:14px;border-radius:12px}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.control select{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.dark{background:#111827;color:#fff}.light{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#991b1b}.back{margin-bottom:18px}
.hidden{display:none!important}.question-card{max-width:850px;margin:20px auto}.qtop{display:flex;justify-content:space-between;gap:15px;align-items:center}.timer{font-weight:900;background:#eff6ff;color:#1d4ed8;padding:10px 14px;border-radius:10px}.qnum{color:var(--muted);font-size:14px}.question{font-size:21px;font-weight:800;line-height:1.5;margin:20px 0}.option{display:block;width:100%;text-align:left;border:2px solid var(--border);background:#fff;padding:15px;margin:10px 0;border-radius:12px;cursor:pointer}.option:hover{border-color:#93c5fd}.option.selected{border-color:var(--primary);background:#eff6ff}.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));width:0}
.result{text-align:center}.score{font-size:55px;font-weight:900;color:var(--primary)}.review{margin-top:20px;text-align:left}.correct{border-left:5px solid var(--success)}.wrong{border-left:5px solid var(--danger)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#f8fafc;padding:16px;border-radius:12px}.stat b{font-size:25px;display:block}.note{font-size:13px;color:var(--muted);line-height:1.5}
footer{padding:35px 18px;text-align:center;color:var(--muted)}
@media(max-width:600px){.top{padding:15px}.container{padding:20px 14px}.stats{grid-template-columns:1fr}.qtop{align-items:flex-start;flex-direction:column}}

.activation{max-width:620px;margin:30px auto}.activation input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;margin:8px 0 12px;font-size:16px;letter-spacing:1px;text-transform:uppercase}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.locked{opacity:.6;pointer-events:none}.subject-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.subject-check{border:1px solid var(--border);padding:12px;border-radius:10px;background:#fff}.subject-check input{width:auto;margin-right:8px}.warning{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;margin-top:12px}

</head>
<body>
<div class="app">
<header class="top"><div class="brand">Chris<span>CBTs</span></div><small>JAMB UTME CBT PRACTICE</small></header>
<main class="container">

<section id="home">
  <div class="home-actions"><button class="btn dark" onclick="openStudent()">👤 Student account</button> <button class="btn primary" onclick="openActivation()">🔐 Activate Access</button> <span id="activationStatus" class="badge hidden">Activated</span></div>
  <p id="studentGreeting" class="note"></p>
  <div class="hero">
    <h1>Practice smarter with ChrisCBTs.</h1>
    <p>Prepare for JAMB UTME by selecting your exam year and exactly four subjects. Practise in CBT mode, track your time, and review your answers instantly.</p>
  </div>
  <div class="grid" id="examGrid"></div>
  <div class="card" style="margin-top:22px">
    <b>Important:</b>
    <span class="note">JAMB UTME practice portal. This build includes original 2026 practice questions across JAMB subjects. Historical past-paper sets must be added only when authorized; this is not an official JAMB website.</span>
  </div>
</section>

<section id="activation" class="hidden">
  <button class="btn light back" onclick="goHome()">← Back</button>
  <div class="card activation">
    <h2>Activate ChrisCBTs</h2>
    <p>Enter the activation code supplied by ChrisCBTs to unlock the CBT question portal.</p>
    <label for="activationCode"><b>Activation code</b></label>
    <input id="activationCode" placeholder="e.g. CHRIS-CBT-2026-XXXX" maxlength="30">
    <button class="btn primary" onclick="activateCode()">Activate</button>
    <p id="activationMessage" class="note"></p>
    <hr>
    <span class="badge">Demo activation portal</span>
    <p class="note">Demo codes work only in this preview. For secure online activation and student accounts, connect Supabase and validate codes server-side; do not store secret keys in this HTML file.</p>
  </div>
</section>

<section id="student" class="hidden">
  <button class="btn light back" onclick="goHome()">← Back</button>
  <div class="card activation"><h2>Student account</h2><p class="note">Create a local practice profile to personalize this browser. This demo profile is not a secure online account and does not sync across devices.</p>
  <label for="studentName"><b>Student name</b></label><input id="studentName" placeholder="Enter your name" maxlength="60" style="width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;margin:8px 0 12px;font-size:16px">
  <label for="studentEmail"><b>Email (optional)</b></label><input id="studentEmail" type="email" placeholder="you@example.com" maxlength="100" style="width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;margin:8px 0 12px;font-size:16px">
  <button class="btn primary" onclick="saveStudent()">Save profile</button> <button class="btn light" onclick="clearStudent()">Clear profile</button><p id="studentMessage" class="note"></p></div>
</section>

<section id="setup" class="hidden">
  <button class="btn light back" onclick="goHome()">← Back</button>
  <h2 id="setupTitle">Choose your practice</h2>

  <div class="card">
    <h3>JAMB examination setup</h3>
    <div class="controls">
      <div class="control"><label>Examination</label><select id="examSelect"><option value="JAMB">JAMB UTME</option></select></div>
      <div class="control"><label>Year</label><select id="yearSelect"></select></div>
    </div>

    <div id="waecRules" class="warning hidden">
      <b>WAEC subject rule:</b> Select a minimum of 7 and a maximum of 9 subjects.
    </div>
    <div id="jambRules" class="warning hidden">
      <b>JAMB subject rule:</b> Select exactly 4 subjects.
    </div>

    <h3 style="margin-top:20px">Select subjects</h3>
    <div id="subjectList" class="subject-list"></div>
    <p id="subjectCount" class="note"></p>

    <div class="controls" style="margin-top:18px">
      <div class="control"><label>Questions per subject (up to 40)</label><select id="countSelect"><option value="10">10 questions</option><option value="20">20 questions</option><option value="40" selected>Up to 40 questions</option></select></div>
      <div class="control"><label>Total test time</label><select id="timeSelect"><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="120" selected>120 minutes</option></select></div>
    </div>
    <button class="btn primary" style="margin-top:16px" onclick="startTest()">Start CBT</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <button class="btn light back" onclick="confirmExit()">← Exit test</button>
  <div class="question-card">
    <div class="qtop"><div><b id="quizTitle"></b><div class="qnum" id="qnum"></div></div><div class="timer" id="timer">00:00</div></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="palette-wrap card"><div class="palette-heading"><b>Question navigator</b><span class="note">Tap a number to jump</span></div><div id="questionPalette" class="question-palette"></div><div class="palette-legend"><span>● Answered</span><span>○ Unanswered</span><span>▣ Current</span></div></div>
    <div class="card" style="margin-top:14px">
      <div class="question" id="questionText"></div>
      <div id="options"></div>
    </div>
    <div class="nav"><button class="btn light" onclick="prevQ()">Previous</button><button class="btn primary" id="nextBtn" onclick="nextQ()">Next</button></div>
  </div>
</section>

<section id="results" class="hidden">
  <button class="btn light back" onclick="goHome()">← Home</button>
  <div class="card result">
    <h2>Test completed 🎉</h2>
    <div class="score" id="scoreText">0%</div>
    <p id="resultText"></p>
    <div class="stats">
      <div class="stat"><b id="correctCount">0</b>Correct</div>
      <div class="stat"><b id="wrongCount">0</b>Wrong</div>
      <div class="stat"><b id="answeredCount">0</b>Answered</div>
    </div>
    <button class="btn primary" style="margin-top:20px" onclick="showReview()">Review Answers</button> <button class="btn light" style="margin-top:20px" onclick="window.print()">Print / Save result</button>
    <button class="btn dark" style="margin-top:20px" onclick="goHome()">Take Another Test</button>
  </div>
  <div id="review" class="review hidden"></div>
</section>

</main>
<footer>© 2026 ChrisCBTs • Independent JAMB UTME practice • Not affiliated with JAMB</footer>
</div>

async function activateFromDatabase(code){
  if(!supabase) throw new Error("Supabase is not configured yet.");
  const clean = String(code || "").trim().toUpperCase();
  if(!clean) throw new Error("Enter an activation code.");
  const { data, error } = await supabase
    .rpc("redeem_activation_code", { p_code: clean });
  if(error) throw error;
  if(!data || !data.success) throw new Error(data?.message || "Invalid or already used code.");
  localStorage.setItem("chrisCBTsActivation", JSON.stringify({
    activated:true, code:clean, activatedAt:new Date().toISOString()
  }));
  return data;
}

  }
  if(!combined.length){
    alert("No authorized question set has been loaded for this exact exam/year/subject selection yet.");
    return;
  }
  state.questions=combined;state.answers=Array(combined.length).fill(null);state.index=0;
  state.seconds=Number(el("timeSelect").value)*60;
  el("quizTitle").textContent=`JAMB UTME PRACTICE • ${state.year}`;
  show("quiz");renderQuestion();startTimer();
}
function renderQuestion(){
  const q=state.questions[state.index];el("qnum").textContent=`${q.subject} • Question ${state.index+1} of ${state.questions.length}`;
  el("questionText").textContent=q.q;el("bar").style.width=((state.index+1)/state.questions.length*100)+"%";
  el("options").innerHTML=q.o.map((x,i)=>`<button class="option ${state.answers[state.index]===i?"selected":""}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join("");
  renderPalette();
  el("nextBtn").textContent=state.index===state.questions.length-1?"Submit Test":"Next";
}
function choose(i){state.answers[state.index]=i;renderQuestion()}
function renderPalette(){const p=el("questionPalette");if(!p)return;p.innerHTML=state.questions.map((q,i)=>`<button class="palette-btn ${i===state.index?"current":""} ${state.answers[i]!==null?"answered":""}" aria-label="Question ${i+1}" onclick="jumpQ(${i})">${i+1}</button>`).join("")}
function jumpQ(i){if(i>=0&&i<state.questions.length){state.index=i;renderQuestion()}}
function prevQ(){if(state.index>0){state.index--;renderQuestion()}}
function nextQ(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}else finishTest()}
function startTimer(){clearInterval(state.timer);updateTimer();state.timer=setInterval(()=>{state.seconds--;updateTimer();if(state.seconds<=0)finishTest(true)},1000)}
function updateTimer(){let m=Math.floor(state.seconds/60).toString().padStart(2,"0"),s=(state.seconds%60).toString().padStart(2,"0");el("timer").textContent=`${m}:${s}`}
function confirmExit(){if(confirm("Exit this test? Your current answers will be lost."))goHome()}
function finishTest(timeUp=false){
  clearInterval(state.timer);let correct=state.questions.reduce((n,q,i)=>n+(state.answers[i]===q.a?1:0),0),answered=state.answers.filter(x=>x!==null).length,wrong=answered-correct;
  state.lastScore=Math.round(correct/state.questions.length*100);el("scoreText").textContent=state.lastScore+"%";el("correctCount").textContent=correct;el("wrongCount").textContent=wrong;el("answeredCount").textContent=answered;
  el("resultText").textContent=(timeUp?"Time is up. ":"Test submitted. ")+`${correct} correct out of ${state.questions.length}. Review your answers below.`;el("review").classList.add("hidden");show("results");
}
function showReview(){
  const html=state.questions.map((q,i)=>{let ok=state.answers[i]===q.a;let chosen=state.answers[i]===null?"Not answered":q.o[state.answers[i]];return `<div class="card ${ok?"correct":"wrong"}" style="margin-bottom:12px"><b>${i+1}. ${q.q}</b><p>Your answer: ${chosen}</p><p>Correct answer: ${q.o[q.a]}</p><p class="note">${q.e}</p></div>`}).join("");
  el("review").innerHTML=html;el("review").classList.remove("hidden");
}
function el(id){return document.getElementById(id)}
function show(id){["home","activation","student","setup","quiz","results"].forEach(name=>el(name).classList.toggle("hidden",name!==id));}
function goHome(){clearInterval(state.timer);show("home")}
function populateExams(){
  el("examGrid").innerHTML=`<div class="card choice" onclick="openSetup('JAMB')"><div class="icon">📝</div><h3>JAMB UTME CBT</h3><p>Choose your year and four subjects, then start practising.</p><button class="btn primary" style="margin-top:16px">Start JAMB Practice</button></div>`;
}
el("examSelect").addEventListener("change",fillSubjects);
const savedActivation=JSON.parse(localStorage.getItem("chrisCBTsActivation")||"null");
state.activated=!!(savedActivation?.activated || localStorage.getItem("chrisCBTsActivated")==="1");
if(state.activated) el("activationStatus").classList.remove("hidden");
populateExams();
const studentProfile=JSON.parse(localStorage.getItem("chrisCBTsStudent")||"null");if(studentProfile)el("studentGreeting").textContent=`Welcome, ${studentProfile.name} — your local student profile is ready.`;
</script>
</body>
</html>
